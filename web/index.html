<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- PNG 하나만 둔다. 예전에 SVG 를 예비로 같이 걸어뒀는데, 크롬은
         선언 순서와 무관하게 SVG 를 우선해서 옛 아이콘이 계속 보였다.
         ?v= 는 캐시 무효화용 — 파비콘은 브라우저가 아주 오래 붙들고 있다. -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eff4fb" />
    <title>AI 트레이딩</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
